openapi: 3.1.0
info:
  title: Ventura HRIS Foundation API
  version: 0.20.0
  description: Foundation APIs for Auth, Setup, Organization, Employee, Governance, Shift Scheduling, Daily Attendance Tracking, Leave Management, WFH, Overtime, Monthly Recaps, Salary Components, Tax Structures, Payroll Engine, Loans, Reimbursements, Payslips, Disbursals, BPJS Social Security, Benefits, Job Requisitions, Postings, ATS, Interview Scheduling, Offer Letters, Performance Cycles, OKRs, Competencies, Appraisals, 360-Degree Feedback, Training Courses, Cohort Sessions, Enrollments, Professional Certifications, Company Asset Inventory, Custodian Allocations, Offboarding Cases, Multi-Departmental Clearance Checklists, and Exit Interviews (Sprints 01 - 20).
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and issue JWT tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "401":
          description: Invalid credentials.
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh expired access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile
      operationId: getCurrentUser
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "401":
          description: Unauthenticated.
  /setup/readiness:
    get:
      tags: [Setup]
      summary: Get Setup module readiness
      operationId: getSetupReadiness
      responses:
        "200":
          description: Setup readiness state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
  /companies:
    get:
      tags: [Setup]
      summary: List companies
      operationId: listCompanies
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated company list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Setup]
      summary: Create company
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /branches:
    get:
      tags: [Setup]
      summary: List branches
      operationId: listBranches
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated branch list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Setup]
      summary: Create branch
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  # ================= ORGANIZATION MODULE =================
  /departments:
    get:
      tags: [Organization]
      summary: List departments
      operationId: listDepartments
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated department list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Organization]
      summary: Create department
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Department created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /departments/{id}:
    get:
      tags: [Organization]
      summary: Get department by ID
      operationId: getDepartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Department found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    put:
      tags: [Organization]
      summary: Update department
      operationId: updateDepartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Department updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    delete:
      tags: [Organization]
      summary: Delete department
      operationId: deleteDepartment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Department deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /divisions:
    get:
      tags: [Organization]
      summary: List divisions
      operationId: listDivisions
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated division list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Organization]
      summary: Create division
      operationId: createDivision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Division created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /divisions/{id}:
    delete:
      tags: [Organization]
      summary: Delete division
      operationId: deleteDivision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Division deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /grades:
    get:
      tags: [Organization]
      summary: List salary grades
      operationId: listGrades
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Salary grade list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Organization]
      summary: Create salary grade
      operationId: createGrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Salary grade created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /grades/{id}:
    delete:
      tags: [Organization]
      summary: Delete salary grade
      operationId: deleteGrade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Salary grade deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /job-levels:
    get:
      tags: [Organization]
      summary: List job levels
      operationId: listJobLevels
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job level list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Organization]
      summary: Create job level
      operationId: createJobLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Job level created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /job-levels/{id}:
    delete:
      tags: [Organization]
      summary: Delete job level
      operationId: deleteJobLevel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job level deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /positions:
    get:
      tags: [Organization]
      summary: List positions
      operationId: listPositions
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated position list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Organization]
      summary: Create position
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Position created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /positions/{id}:
    delete:
      tags: [Organization]
      summary: Delete position
      operationId: deletePosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Position deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /organization-units/tree:
    get:
      tags: [Organization]
      summary: Get recursive hierarchical organization tree
      operationId: getOrganizationTree
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recursive organization tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"

  /organization-units:
    get:
      tags: [Organization]
      summary: Get flat list of active organization units
      operationId: listOrganizationUnits
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Flat unit list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"

  /organization-units/{id}/parent:
    put:
      tags: [Organization]
      summary: Re-parent organization unit with cycle prevention and change logging
      operationId: moveUnitParent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveDate]
              properties:
                newParentUnitId:
                  type: string
                  format: uuid
                effectiveDate:
                  type: string
                  format: date
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Unit moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "400":
          description: Cycle detected (ORG_HIERARCHY_CYCLE) or invalid move.

  /organization-units/{id}/history:
    get:
      tags: [Organization]
      summary: Get unit re-parenting audit history
      operationId: getUnitHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Historical change list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"

  /employees:
    get:
      tags: [Employee]
      summary: Search and list employee master records
      operationId: getEmployees
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: List of employees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Employee]
      summary: Register new employee master record
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /employees/{id}:
    get:
      tags: [Employee]
      summary: Get employee profile details by ID
      operationId: getEmployeeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Employee summary and assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    put:
      tags: [Employee]
      summary: Update employee assignments and names
      operationId: updateEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    delete:
      tags: [Employee]
      summary: Soft delete employee
      operationId: deleteEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Employee soft deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /employees/{id}/personal-information:
    get:
      tags: [Employee Profile]
      summary: Get employee sensitive personal identity information
      operationId: getPersonalInformation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Personal information record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    put:
      tags: [Employee Profile]
      summary: Upsert employee sensitive personal identity information
      operationId: updatePersonalInformation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalInformationRequest"
      responses:
        "200":
          description: Personal information updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /employees/{id}/emergency-contacts:
    get:
      tags: [Employee Profile]
      summary: List employee emergency contacts
      operationId: getEmergencyContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of emergency contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Employee Profile]
      summary: Add emergency contact
      operationId: createEmergencyContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmergencyContactRequest"
      responses:
        "201":
          description: Emergency contact added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /employees/{id}/emergency-contacts/{contactId}:
    delete:
      tags: [Employee Profile]
      summary: Remove emergency contact
      operationId: deleteEmergencyContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact removed.

  /employees/{id}/contracts:
    get:
      tags: [Employee Lifecycle]
      summary: List employment contracts
      operationId: getContracts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of contracts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Employee Lifecycle]
      summary: Create non-overlapping employment contract
      operationId: createContract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractRequest"
      responses:
        "201":
          description: Contract created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /employees/{id}/status-changes:
    post:
      tags: [Employee Lifecycle]
      summary: Transition employee lifecycle status with audit logging
      operationId: changeEmployeeStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
      responses:
        "200":
          description: Status transitioned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /employees/{id}/status-history:
    get:
      tags: [Employee Lifecycle]
      summary: Get employment status audit history trail
      operationId: getStatusHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Historical status transitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"

  /employees/{id}/documents:
    get:
      tags: [Employee Documents]
      summary: List employee document metadata records
      operationId: getDocuments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Employee Documents]
      summary: Register employee document record
      operationId: createDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document registered.
          content:
            application/json:
  /permissions:
    get:
      tags: [Governance & RBAC]
      summary: List all system permissions
      operationId: listPermissions
      responses:
        "200":
          description: List of permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"

  /roles:
    get:
      tags: [Governance & RBAC]
      summary: List all roles with their assigned permissions
      operationId: listRoles
      responses:
        "200":
          description: List of roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [Governance & RBAC]
      summary: Create a custom role
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /roles/{id}:
    put:
      tags: [Governance & RBAC]
      summary: Update role details and permission assignments
      operationId: updateRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"
    delete:
      tags: [Governance & RBAC]
      summary: Delete a custom role
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /users:
    get:
      tags: [User Governance]
      summary: List system users with roles and status
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated user list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiListResponse"
    post:
      tags: [User Governance]
      summary: Create user account
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiObjectResponse"

  /users/{id}/roles:
    put:
      tags: [User Governance]
      summary: Assign roles to a user
      operationId: updateUserRoles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
      responses:
