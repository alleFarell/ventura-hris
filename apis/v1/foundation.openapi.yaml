components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiObjectResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
        data:
          type: object
        message:
          type: string
        meta:
          type: object
    ApiListResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        message:
          type: string
        meta:
          type: object
    ApiErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    LoginRequest:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail:
          type: string
          example: admin
        password:
          type: string
          example: Admin@123456
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    CreateCompanyRequest:
      type: object
      required: [code, name, legalName, defaultLocale, timezone]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 30
        name:
          type: string
          maxLength: 150
        legalName:
          type: string
          maxLength: 200
        defaultLocale:
          type: string
          example: en-US
        timezone:
          type: string
          example: Asia/Jakarta
    CreateDepartmentRequest:
      type: object
      required: [companyId, code, name]
      properties:
        companyId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 30
        name:
