spring:
  application:
    name: ventura-hris
  datasource:
    url: ${VENTURA_DB_URL:jdbc:postgresql://localhost:5432/ventura_hris}
    username: ${VENTURA_DB_USERNAME:ventura}
    password: ${VENTURA_DB_PASSWORD:ventura_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:5174}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ventura:
  security:
    jwt:
      secret: ${VENTURA_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 900000
      refresh-expiration-ms: 604800000
    cors:
      allowed-origins: ${VENTURA_CORS_ALLOWED_ORIGINS:http://localhost:310*,http://127.0.0.1:310*}


