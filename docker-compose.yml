services:
  postgres:
    image: postgres:16-alpine
    container_name: ventura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ventura_hris
      POSTGRES_USER: ventura
      POSTGRES_PASSWORD: ventura_local_password
    ports:
      - "5432:5432"
    volumes:
      - ventura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventura -d ventura_hris"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ventura_pgdata:
